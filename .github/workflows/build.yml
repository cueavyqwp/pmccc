name: build

on:
  push:
    paths:
      - "src/**"
      - "requirements.txt"
      - "pack.py"
      - "pyproject.json"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Build
        run: |
          python -m pip install --upgrade pip setuptools build toml
          python -m pip install -r requirements.txt
          python pack.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmccc
          path: dist
